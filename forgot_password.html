<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - WPU MRS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="login-container">
    <form action="forgot_password.php" method="POST" class="login-form">
      <h2>Forgot Password</h2>
      <p>Enter your university email address and we will send you a secure link to reset your password.</p>

      <label for="email">University Email</label>
      <input type="email" id="email" name="email" placeholder="name@student.wpu.ac.pg" required>

      <button type="submit" class="btn-primary">Reset Password</button>
      <p class="forgot"><a href="login.html">Back to Login</a></p>
    </form>
  </div>
</body>
</html>
