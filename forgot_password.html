<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - WPU MRS</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="login-container">
    <h2>Forgot Password</h2>
    <form action="../backend/forgot_password.php" method="POST" class="login-form">
      <label for="email">Enter your University Email</label>
      <input type="email" id="email" name="email" required>
      <button type="submit" class="btn-primary">Reset Password</button>
      <p class="forgot"><a href="login.html">Back to Login</a></p>
    </form>
  </div>
</body>
</html>
