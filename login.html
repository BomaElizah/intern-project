<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WPU MRS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="login-container">
    <form action="login.php" method="POST" class="login-form">
      <h2>Welcome back</h2>
      <p>Access the Western Pacific University maintenance portal to submit requests and track progress across campus.</p>

      <label for="email">University Email or ID</label>
      <input type="text" id="email" name="email" placeholder="e.g. student@wpu.ac.pg" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>

      <button type="submit" class="btn-primary">Login</button>
      <p class="forgot"><a href="forgot_password.html">Forgot Password?</a></p>
      <p class="forgot">New to WPU? <a href="register.html">Create an account</a></p>
    </form>
  </div>
</body>
</html>
