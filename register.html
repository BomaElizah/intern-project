<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - WPU MRS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <h2>Create Account</h2>
    <form action="register.php" method="POST" class="login-form">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" required>

      <label for="email">University Email</label>
      <input type="email" id="email" name="email" required>

      <label for="id_number">University ID Number</label>
      <input type="text" id="id_number" name="id_number" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <label for="role_id">Role</label>
      <select id="role_id" name="role_id" required>
        <option value="1">Student</option>
        <option value="2">Staff</option>
        <option value="3">Academic</option>
        <option value="4">Maintenance Officer</option>
        <option value="5">Supervisor</option>
        <option value="6">Administrator</option>
      </select>

      <button type="submit" class="btn-primary">Register</button>
      <p class="forgot"><a href="login.html">Already have an account? Login</a></p>
    </form>
  </div>
</body>
</html>
